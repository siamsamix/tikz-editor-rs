[package]
name = "tikz-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless TikZ renderer CLI used for golden parity and benchmarks."

[[bin]]
name = "tikz-cli"
path = "src/main.rs"

[dependencies]
tikz-core = { path = "../tikz-core" }
# serde_json is used to serialize the parse dump for M0-2 statement parity.
serde_json = "1"
