[package]
name = "tikz-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safe-Rust port of the tikz-editor core pipeline: parse -> semantic scene -> SVG/canvas."

[lib]
path = "src/lib.rs"

[dependencies]
# serde/serde_json are added solely to serialize the parsed AST for the
# statement-AST parity runner (migration/statement_parity.py, task M0-2).
# tikz-core otherwise stays dependency-free (see AGENTS.md §2.2 dep policy).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.6"
approx = "0.5"

