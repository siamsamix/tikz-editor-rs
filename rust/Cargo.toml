[workspace]
resolver = "2"
members = ["crates/tikz-core", "crates/tikz-cli", "crates/tikz-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# eframe's `wgpu` feature enables the renderer but no graphics backend, so
# `Instance::new` panics at startup ("No wgpu backend ... was enabled"). This
# direct dependency unifies features onto the same `wgpu` crate eframe uses
# and turns on the two backends that matter on desktop Linux.
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
